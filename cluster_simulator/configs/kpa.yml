kind: PodAutoscaler
metadata:
  name: Llama-3.1-8B-kpa
  namespace: default
  labels:
    scale-down-delay: 30s
spec:
  scalingStrategy: KPA
  minReplicas: 1
  maxReplicas: 8
  metricsSources:
    - metricSourceType: pod
      protocolType: http
      port: '8000'
      path: /metrics
      targetMetric: concurrency
      targetValue: '10'
  scaleTargetRef:
    name: Llama-3.1-8B